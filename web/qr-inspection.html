<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR同梱物検品 - 出荷検品システム</title>
    
    <!-- バージョン情報 -->
    <meta name="version" content="3.0.0">
    <meta name="build-date" content="2025-10-24">
    <meta name="library" content="html5-qrcode">
    
    <!-- キャッシュ制御メタタグ（iOS Safari対応） -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            min-height: 100vh;
        }
        .inspection-header {
            background: linear-gradient(135deg, #ffc107, #ff9800);
            color: white;
            padding: 1.5rem 0;
            box-shadow: 0 0.25rem 0.5rem rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .qr-scanner-area {
            border: 2px dashed #0d6efd;
            border-radius: 0.5rem;
            padding: 1rem;
            text-align: center;
            background-color: #000;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        .qr-video-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            aspect-ratio: 4/3;
            background: #000;
            border-radius: 0.5rem;
            overflow: hidden;
        }
        .qr-video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 0.5rem;
        }
        .qr-scan-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            border: 2px solid rgba(96, 165, 250, 0.8);
            border-radius: 12px;
            pointer-events: none;
            z-index: 10;
        }
        .qr-scan-corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 3px solid #60a5fa;
        }
        .qr-scan-corner.tl { top: -3px; left: -3px; border-right: none; border-bottom: none; }
        .qr-scan-corner.tr { top: -3px; right: -3px; border-left: none; border-bottom: none; }
        .qr-scan-corner.bl { bottom: -3px; left: -3px; border-right: none; border-top: none; }
        .qr-scan-corner.br { bottom: -3px; right: -3px; border-left: none; border-top: none; }
        @keyframes scan-line {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }
        .qr-scan-line {
            position: absolute;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #60a5fa, transparent);
            animation: scan-line 2s ease-in-out infinite;
            z-index: 11;
        }
        .qr-status-overlay {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 1rem;
            font-size: 0.875rem;
            z-index: 12;
            max-width: 90%;
            text-align: center;
        }
        
        /* safari.html統合: デバッグ情報スタイル */
        .debug-info {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.85);
            color: #00ff00;
            padding: 10px;
            border-radius: 8px;
            font-size: 11px;
            font-family: 'Courier New', monospace;
            max-width: 280px;
            max-height: 400px;
            overflow-y: auto;
            line-height: 1.4;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            z-index: 20;
        }
        .debug-info .debug-title {
            color: #ffff00;
            font-weight: bold;
            border-bottom: 1px solid #444;
            padding-bottom: 4px;
            margin-bottom: 6px;
        }
        .debug-info .debug-section {
            margin-bottom: 8px;
        }
        .debug-info .debug-label {
            color: #00ccff;
            display: inline-block;
            min-width: 100px;
        }
        .debug-info .debug-value {
            color: #00ff00;
        }
        
        /* safari.html統合: キャリブレーション表示 */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .calibrating {
            animation: pulse 1s ease-in-out infinite;
        }
        
        /* safari.html統合: スキャン中アニメーション */
        @keyframes scanning {
            0% { background-position: 0% 0%; }
            100% { background-position: 0% 100%; }
        }
        .scanning-line {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            background: linear-gradient(180deg, transparent 0%, transparent 45%, #60a5fa 50%, transparent 55%, transparent 100%);
            background-size: 100% 200%;
            animation: scanning 2s linear infinite;
            border-radius: 12px;
            pointer-events: none;
            z-index: 11;
        }
        .qr-item-card {
            border-left: 4px solid #ffc107;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }
        .qr-item-card.scanned {
            border-left-color: #198754;
            background-color: #d1e7dd;
        }
        .qr-status-icon {
            font-size: 1.5rem;
            margin-right: 0.5rem;
        }
        .qr-pending { color: #ffc107; }
        .qr-scanned { color: #198754; }
        .action-buttons {
            position: sticky;
            bottom: 0;
            background: white;
            padding: 1rem;
            border-top: 2px solid #dee2e6;
            box-shadow: 0 -0.5rem 1rem rgba(0,0,0,0.1);
            z-index: 999;
        }
        .progress-card {
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            border: 2px solid #2196f3;
        }
    </style>
</head>
<body>
    <!-- ヘッダー -->
    <div class="inspection-header">
        <div class="container-fluid">
            <div class="row align-items-center">
                <div class="col">
                    <h1 class="h4 mb-0">
                        <i class="fas fa-qrcode me-2"></i>QR同梱物検品
                    </h1>
                </div>
                <div class="col-auto">
                    <button class="btn btn-light btn-sm" onclick="window.close()">
                        <i class="fas fa-times me-1"></i>閉じる
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="container-fluid py-4">
        <div class="row">
            <!-- 左側: QRスキャナーエリア -->
            <div class="col-lg-6 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0">
                            <i class="fas fa-camera me-2"></i>QRコードスキャン
                        </h5>
                    </div>
                    <div class="card-body">
                        <!-- 検品者名選択 -->
                        <div class="mb-3">
                            <label for="qr-inspector-name" class="form-label">
                                <i class="fas fa-user me-1"></i>検品者名 <span class="text-danger">*</span>
                            </label>
                            <select class="form-select" id="qr-inspector-name" required>
                                <option value="田中太郎" selected>田中太郎</option>
                                <option value="佐藤花子">佐藤花子</option>
                                <option value="山田次郎">山田次郎</option>
                            </select>
                        </div>

                        <!-- スキャナーエリア -->
                        <div id="qr-inspection-content">
                            <!-- QRスキャナーUIがここに動的に生成されます -->
                        </div>

                        <!-- 操作ボタン -->
                        <div class="mt-3 d-grid gap-2">
                            <button type="button" class="btn btn-primary btn-lg" id="btn-start-qr-scan">
                                <i class="fas fa-camera me-2"></i>QRスキャン開始
                            </button>
                            <div class="btn-group" role="group">
                                <button type="button" class="btn btn-outline-secondary" id="btn-manual-input">
                                    <i class="fas fa-keyboard me-1"></i>手動入力
                                </button>
                                <button type="button" class="btn btn-outline-secondary" id="btn-test-scan">
                                    <i class="fas fa-vial me-1"></i>テストスキャン
                                </button>
                            </div>
                        </div>

                        <!-- ステータス表示 -->
                        <div id="qr-status-message" class="mt-3 alert alert-info" style="display: none;">
                            <i class="fas fa-info-circle me-2"></i>
                            <span id="qr-status-text">準備完了</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右側: 検品リストと進捗 -->
            <div class="col-lg-6 mb-4">
                <!-- 進捗カード -->
                <div class="card shadow-sm progress-card mb-3">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h5 class="mb-0">
                                <i class="fas fa-tasks me-2"></i>検品進捗
                            </h5>
                            <span class="badge bg-primary" id="qr-progress-badge">0 / 0</span>
                        </div>
                        <div class="progress" style="height: 25px;">
                            <div id="qr-progress-bar" class="progress-bar progress-bar-striped progress-bar-animated" 
                                 role="progressbar" style="width: 0%">0%</div>
                        </div>
                        <div class="mt-2 text-center">
                            <small class="text-muted" id="qr-progress-label">スキャン待ち</small>
                        </div>
                    </div>
                </div>

                <!-- 検品リスト -->
                <div class="card shadow-sm">
                    <div class="card-header bg-warning text-dark">
                        <h5 class="mb-0">
                            <i class="fas fa-list me-2"></i>検品対象一覧
                        </h5>
                    </div>
                    <div class="card-body" style="max-height: 500px; overflow-y: auto;">
                        <div id="qr-items-list">
                            <!-- 検品アイテムがここに動的に生成されます -->
                            <div class="text-center text-muted py-5">
                                <i class="fas fa-spinner fa-spin fa-2x mb-3"></i>
                                <p>検品データを読み込み中...</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 結果表示エリア -->
                <div id="qr-result-container" class="mt-3" style="display: none;">
                    <!-- 結果がここに表示されます -->
                </div>
            </div>
        </div>
    </div>

    <!-- フッターボタン -->
    <div class="action-buttons">
        <div class="container-fluid">
            <div class="row">
                <div class="col">
                    <button type="button" class="btn btn-secondary" onclick="window.close()">
                        <i class="fas fa-times me-2"></i>キャンセル
                    </button>
                    <small class="text-muted ms-2" id="version-info">
                        v<span id="app-version">2.1.1</span> 
                        (<span id="build-date">2025-10-18</span>)
                    </small>
                </div>
                <div class="col-auto">
                    <button type="button" class="btn btn-success btn-lg" id="btn-complete-qr-inspection">
                        <i class="fas fa-check me-2"></i>検品完了
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- html5-qrcode ライブラリ（バーコード・QRコード対応） -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    
    <script>
    /**
     * QR同梱物検品システム - html5-qrcode統合版
     * バーコード（1次元）とQRコード（2次元）の両方に対応
     */
    
    class Html5QRCodeInspection {
        constructor() {
            // バージョン情報
            this.version = '3.0.0';
            this.buildDate = '2025-10-24';
            this.gitCommit = 'html5-qrcode';
            
            // html5-qrcode スキャナー
            this.html5QrCode = null;
            this.isScanning = false;
            this.lastScannedCode = '';
            this.lastScannedTime = 0;
            this.scanDedupDelay = 1000; // 1秒以内の重複スキャンを無視
            
            // 検品システム固有プロパティ
            this.inspectorName = '';
            this.scannedItems = new Set();
            this.targetItems = [];
            
            this.init();
        }
        
        init() {
            this.logVersionInfo();
            this.initElements();
            this.initEventListeners();
            this.initPageLifecycleHandling();
            this.loadMockData();
        }
        
        // バージョン情報をログ出力
        logVersionInfo() {
            console.log('%c╔════════════════════════════════════════════╗', 'color: #00a8ff; font-weight: bold;');
            console.log('%c║  QR同梱物検品システム                      ║', 'color: #00a8ff; font-weight: bold;');
            console.log('%c║  html5-qrcode統合版                        ║', 'color: #00a8ff; font-weight: bold;');
            console.log('%c║  バーコード・QRコード対応                  ║', 'color: #00a8ff; font-weight: bold;');
            console.log('%c╠════════════════════════════════════════════╣', 'color: #00a8ff; font-weight: bold;');
            console.log('%c║  Version:    ' + this.version.padEnd(30) + '║', 'color: #0be881;');
            console.log('%c║  Build Date: ' + this.buildDate.padEnd(30) + '║', 'color: #0be881;');
            console.log('%c║  Library:    html5-qrcode' + ''.padEnd(19) + '║', 'color: #0be881;');
            console.log('%c║  User Agent: ' + navigator.userAgent.substring(0, 28).padEnd(30) + '║', 'color: #ffd32a;');
            console.log('%c╚════════════════════════════════════════════╝', 'color: #00a8ff; font-weight: bold;');
            
            // グローバルに公開（デバッグ用）
            window.QR_INSPECTION_VERSION = {
                version: this.version,
                buildDate: this.buildDate,
                library: 'html5-qrcode',
                timestamp: new Date().toISOString()
            };
        }
        
        initElements() {
            // ボタン要素
            this.btnStartScan = document.getElementById('btn-start-qr-scan');
            this.btnManualInput = document.getElementById('btn-manual-input');
            this.btnTestScan = document.getElementById('btn-test-scan');
            this.btnComplete = document.getElementById('btn-complete-qr-inspection');
            
            // 表示エリア
            this.inspectionContent = document.getElementById('qr-inspection-content');
            this.itemsList = document.getElementById('qr-items-list');
            this.statusMessage = document.getElementById('qr-status-message');
            this.statusText = document.getElementById('qr-status-text');
            this.progressBar = document.getElementById('qr-progress-bar');
            this.progressBadge = document.getElementById('qr-progress-badge');
            this.progressLabel = document.getElementById('qr-progress-label');
            this.resultContainer = document.getElementById('qr-result-container');
            
            // 検品者名入力
            this.inspectorNameInput = document.getElementById('qr-inspector-name');
        }
        
        initEventListeners() {
            this.btnStartScan.addEventListener('click', () => this.handleStartScan());
            this.btnManualInput.addEventListener('click', () => this.handleManualInput());
            this.btnTestScan.addEventListener('click', () => this.handleTestScan());
            this.btnComplete.addEventListener('click', () => this.handleComplete());
        }
        
        // ページライフサイクル対応
        initPageLifecycleHandling() {
            // ページアンロード時にスキャンを停止
            window.addEventListener('beforeunload', () => {
                if (this.html5QrCode && this.isScanning) {
                    try {
                        this.html5QrCode.stop().catch(err => {
                            console.warn('[Cleanup] Stop error:', err);
                        });
                    } catch (error) {
                        console.warn('[Cleanup] Error:', error);
                    }
                }
            });
            
            // Page Visibility API
            document.addEventListener('visibilitychange', () => {
                if (document.hidden && this.isScanning) {
                    console.log('[Visibility] Page hidden - pausing');
                } else if (!document.hidden && this.isScanning) {
                    console.log('[Visibility] Page visible - resuming');
                }
            });
        }
        
        async handleStartScan() {
            // 検品者名チェック
            this.inspectorName = this.inspectorNameInput.value;
            if (!this.inspectorName) {
                alert('検品者名を選択してください');
                this.inspectorNameInput.focus();
                return;
            }
            
            console.log(`[Start] Starting scan for inspector: ${this.inspectorName}`);
            
            try {
                await this.startScan();
            } catch (error) {
                this.handleError(error);
            }
        }
        
        // html5-qrcode スキャン開始
        async startScan() {
            if (this.isScanning) {
                console.warn('[Start] Already scanning');
                return;
            }
            
            // カメラUI作成
            this.createCameraUI();
            
            // html5-qrcode インスタンス作成
            this.html5QrCode = new Html5Qrcode("qr-reader-container");
            
            // スキャン成功コールバック
            const onScanSuccess = (decodedText, decodedResult) => {
                const currentTime = Date.now();
                
                // 重複スキャン防止（1秒以内の同一コードは無視）
                if (decodedText === this.lastScannedCode && 
                    currentTime - this.lastScannedTime < this.scanDedupDelay) {
                    return;
                }
                
                this.lastScannedCode = decodedText;
                this.lastScannedTime = currentTime;
                
                const codeType = decodedResult.result.format.formatName;
                console.log(`[Scan] Detected ${codeType}:`, decodedText);
                
                this.handleQRResult(decodedText, codeType);
            };
            
            // スキャン設定
            const config = {
                fps: 5,  // 5回/秒
                qrbox: { width: 250, height: 250 },
                formatsToSupport: [
                    // 1次元バーコード
                    Html5QrcodeSupportedFormats.CODE_39,
                    Html5QrcodeSupportedFormats.CODE_93,
                    Html5QrcodeSupportedFormats.CODE_128,
                    Html5QrcodeSupportedFormats.EAN_13,
                    Html5QrcodeSupportedFormats.EAN_8,
                    Html5QrcodeSupportedFormats.UPC_A,
                    Html5QrcodeSupportedFormats.UPC_E,
                    Html5QrcodeSupportedFormats.ITF,
                    // 2次元コード
                    Html5QrcodeSupportedFormats.QR_CODE,
                    Html5QrcodeSupportedFormats.DATA_MATRIX,
                    Html5QrcodeSupportedFormats.AZTEC,
                    Html5QrcodeSupportedFormats.PDF_417
                ]
            };
            
            try {
                await this.html5QrCode.start(
                    { facingMode: "environment" },  // 背面カメラ
                    config,
                    onScanSuccess
                );
                
                this.isScanning = true;
                this.showStatus('スキャン開始しました', 'success');
                console.log('[Start] Scanning started successfully');
                
                // ボタンを停止に変更
                this.btnStartScan.innerHTML = '<i class="fas fa-stop me-2"></i>スキャン停止';
                this.btnStartScan.classList.remove('btn-primary');
                this.btnStartScan.classList.add('btn-danger');
                this.btnStartScan.onclick = () => this.stopScan();
                
            } catch (error) {
                console.error('[Start] Failed to start scan:', error);
                this.handleError(error);
                // UI をクリーンアップ
                this.inspectionContent.innerHTML = '<div class="text-center text-muted py-5"><p>カメラの起動に失敗しました</p></div>';
            }
        }
        
        createCameraUI() {
            this.inspectionContent.innerHTML = `
                <div id="qr-reader-container" style="width: 100%; border-radius: 0.5rem; overflow: hidden;"></div>
                <div class="mt-3">
                    <div class="alert alert-info">
                        <i class="fas fa-info-circle me-2"></i>
                        <strong>バーコード・QRコード対応</strong><br>
                        <small>CODE-128, EAN-13, UPC, QRコードなど12種類に対応</small>
                    </div>
                </div>
            `;
        }

        
        // QR/バーコード検出結果処理（検品システム統合）
        handleQRResult(data, codeType = 'Unknown') {
            if (!this.isScanning) return;
            
            console.log(`[Scan] Detected ${codeType}:`, data);
            
            // 検品リストと照合
            const item = this.targetItems.find(item => item.code === data);
            
            if (item) {
                if (this.scannedItems.has(data)) {
                    this.showStatus(`既にスキャン済みです: ${item.name}`, 'warning');
                    this.playBeep('error');
                } else {
                    this.scannedItems.add(data);
                    this.updateItemStatus(data, true);
                    this.updateProgress();
                    this.showStatus(`✓ スキャン完了 (${codeType}): ${item.name}`, 'success');
                    this.playBeep('success');
                    
                    // 全てスキャン完了チェック
                    if (this.scannedItems.size === this.targetItems.length) {
                        setTimeout(() => {
                            this.stopScan();
                            this.showStatus('全ての検品が完了しました！', 'success');
                        }, 1000);
                    }
                }
            } else {
                this.showStatus(`該当なし (${codeType}): ${data}`, 'danger');
                this.playBeep('error');
            }
        }
        
        stopScan() {
            if (!this.isScanning) return;
            
            console.log('[Stop] Stopping scan...');
            this.isScanning = false;
            
            // html5-qrcode スキャン停止
            if (this.html5QrCode) {
                this.html5QrCode.stop()
                    .then(() => {
                        console.log('[Stop] Scanner stopped successfully');
                        this.html5QrCode = null;
                    })
                    .catch(err => {
                        console.error('[Stop] Error stopping scanner:', err);
                    });
            }
            
            // UIリセット
            this.inspectionContent.innerHTML = '<div class="text-center text-muted py-5"><p>スキャナーは停止しました</p></div>';
            
            // ボタンを開始状態に戻す
            this.btnStartScan.innerHTML = '<i class="fas fa-camera me-2"></i>QRスキャン開始';
            this.btnStartScan.classList.remove('btn-danger');
            this.btnStartScan.classList.add('btn-primary');
            this.btnStartScan.onclick = null;
            this.btnStartScan.addEventListener('click', () => this.handleStartScan(), { once: true });
            
            this.showStatus('スキャンを停止しました', 'info');
        }
        
        handleError(error) {
            let message = 'カメラにアクセスできませんでした。';
            
            if (error.name) {
                switch (error.name) {
                    case 'NotAllowedError':
                        message = 'カメラの使用が拒否されました。ブラウザの設定からカメラの許可を有効にしてください。';
                        break;
                    case 'NotFoundError':
                        message = 'カメラが見つかりませんでした。デバイスにカメラが接続されているか確認してください。';
                        break;
                    case 'NotSupportedError':
                        message = 'このブラウザではカメラ機能がサポートされていません。最新のブラウザをご利用ください。';
                        break;
                    case 'NotReadableError':
                        message = 'カメラが他のアプリケーションで使用中です。他のアプリを閉じてから再試行してください。';
                        break;
                    case 'SecurityError':
                        message = 'セキュリティ制限によりカメラにアクセスできません。HTTPS環境が必要です。';
                        break;
                }
            } else if (error.message) {
                message = error.message;
            }

            this.showStatus(message, 'danger');
            console.error('[Error]', error);
            
            alert(message);
        }
        
        handleManualInput() {
            const input = prompt('コードを手入力してください (バーコード/QRコード):');
            if (input && input.trim()) {
                this.handleQRResult(input.trim(), 'Manual');
            }
        }
        
        handleTestScan() {
            // テスト用: ランダムにアイテムをスキャン
            const unscannedItems = this.targetItems.filter(item => !this.scannedItems.has(item.code));
            if (unscannedItems.length > 0) {
                const randomItem = unscannedItems[Math.floor(Math.random() * unscannedItems.length)];
                this.handleQRResult(randomItem.code);
            } else {
                this.showStatus('全てスキャン済みです', 'info');
            }
        }
        
        handleComplete() {
            const unscanned = this.targetItems.length - this.scannedItems.size;
            
            if (unscanned > 0) {
                if (!confirm(`未スキャンのアイテムが${unscanned}件あります。検品を完了しますか？`)) {
                    return;
                }
            }
            
            alert(`検品完了\n検品者: ${this.inspectorName}\nスキャン済み: ${this.scannedItems.size}/${this.targetItems.length}`);
            
            // 実際のシステムでは、ここでデータを送信
            console.log('検品完了データ:', {
                inspector: this.inspectorName,
                scannedItems: Array.from(this.scannedItems),
                totalItems: this.targetItems.length,
                timestamp: new Date().toISOString()
            });
        }
        
        showStatus(message, type = 'info') {
            this.statusText.textContent = message;
            this.statusMessage.className = `mt-3 alert alert-${type}`;
            this.statusMessage.style.display = 'block';
            
            setTimeout(() => {
                this.statusMessage.style.display = 'none';
            }, 3000);
        }
        
        updateItemStatus(code, scanned) {
            const itemCard = document.querySelector(`[data-item-code="${code}"]`);
            if (itemCard) {
                if (scanned) {
                    itemCard.classList.add('scanned');
                    itemCard.querySelector('.qr-status-icon').innerHTML = '<i class="fas fa-check-circle qr-scanned"></i>';
                } else {
                    itemCard.classList.remove('scanned');
                    itemCard.querySelector('.qr-status-icon').innerHTML = '<i class="fas fa-clock qr-pending"></i>';
                }
            }
        }
        
        updateProgress() {
            const total = this.targetItems.length;
            const scanned = this.scannedItems.size;
            const percentage = total > 0 ? Math.round((scanned / total) * 100) : 0;
            
            this.progressBar.style.width = percentage + '%';
            this.progressBar.textContent = percentage + '%';
            this.progressBadge.textContent = `${scanned} / ${total}`;
            this.progressLabel.textContent = scanned === total ? '検品完了' : `残り ${total - scanned} 件`;
            
            if (scanned === total) {
                this.progressBar.classList.remove('progress-bar-animated');
                this.progressBar.classList.add('bg-success');
            }
        }
        
        loadMockData() {
            // モックデータ: 実際のシステムではAPIから取得
            this.targetItems = [
                { code: 'ITEM001', name: '商品A', quantity: 1 },
                { code: 'ITEM002', name: '商品B', quantity: 2 },
                { code: 'ITEM003', name: '商品C', quantity: 1 },
                { code: 'ITEM004', name: '商品D', quantity: 3 },
                { code: 'ITEM005', name: '商品E', quantity: 1 }
            ];
            
            this.renderItemsList();
            this.updateProgress();
        }
        
        renderItemsList() {
            this.itemsList.innerHTML = this.targetItems.map(item => `
                <div class="card qr-item-card" data-item-code="${item.code}">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div class="qr-status-icon">
                                <i class="fas fa-clock qr-pending"></i>
                            </div>
                            <div class="flex-grow-1">
                                <h6 class="mb-1">${item.name}</h6>
                                <small class="text-muted">コード: ${item.code} | 数量: ${item.quantity}</small>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        playBeep(type = 'success') {
            // ビープ音（オプション）
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = type === 'success' ? 800 : 400;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.2);
            } catch (error) {
                console.warn('Audio playback error:', error);
            }
        }
    }
    
    // アプリケーション初期化
    document.addEventListener('DOMContentLoaded', () => {
        window.qrInspectionApp = new Html5QRCodeInspection();
    });
    </script>
</body>
</html>
