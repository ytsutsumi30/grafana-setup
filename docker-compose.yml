services:
  # nginx - リバースプロキシ & 静的ファイル配信
  nginx:
    image: nginx:alpine
    container_name: production-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./web:/usr/share/nginx/html
      - ./ssl:/etc/nginx/ssl
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - production-api
    networks:
      - production-network

  # PostgreSQL データベース (ローカルコンテナは不使用、RDS利用)
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: production-postgres
  #   restart: unless-stopped
  #   ports:
  #     - "5432:5432"
  #   environment:
  #     - POSTGRES_DB=production_db
  #     - POSTGRES_USER=production_user
  #     - POSTGRES_PASSWORD=production_pass
  #     - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --locale=C
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #     - ./postgres/init:/docker-entrypoint-initdb.d
  #   logging:
  #     driver: "json-file"
  #     options:
  #       max-size: "10m"
  #       max-file: "3"
  #   networks:
  #     - production-network

  # 生産管理API サーバー
  production-api:
    image: node:18-alpine
    container_name: production-api
    restart: unless-stopped
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # RDS PostgreSQL接続設定
      - DB_HOST=poc-production-db.cj4ycmcqcrbj.ap-northeast-1.rds.amazonaws.com
      - DB_PORT=5432
      - DB_NAME=production_db
      - DB_USER=production_user
      - DB_PASSWORD=ChangeThisPassword123!
      - DB_SSL=true
      - DB_SSL_REJECT_UNAUTHORIZED=false
  # AWS設定（既存）
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
  # GCP設定（新規追加）
      - GOOGLE_APPLICATION_CREDENTIALS=/app/secrets/documentai-key.json
      - DOCUMENTAI_PROJECT_ID=${DOCUMENTAI_PROJECT_ID:-577010681495}
      - DOCUMENTAI_LOCATION=${DOCUMENTAI_LOCATION:-us}
      - DOCUMENTAI_PROCESSOR_ID=${DOCUMENTAI_PROCESSOR_ID}
    env_file:
      - ./api/.env
    volumes:
      - ./api:/app
      - ./secrets:/app/secrets:ro  # ← この行を追加
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    command: sh -c "npm install && npm start"
    # RDS使用時はpostgresコンテナへの依存を削除
    # depends_on:
    #   - postgres
    networks:
      - production-network

  # Grafana - 既存設定を維持（手動管理）
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    profiles:
      - monitoring
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - production-network

  # Prometheus - 既存設定を維持（手動管理）
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    profiles:
      - monitoring
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-storage:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
      - '--web.external-url=http://localhost/prometheus/'
      - '--web.route-prefix=/prometheus/'
    networks:
      - production-network

volumes:
  grafana-storage:
  prometheus-storage:
  postgres-data:

networks:
  production-network:
    driver: bridge
